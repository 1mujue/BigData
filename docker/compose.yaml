name: paper-hdfs

services:
  namenode:
    image: ghcr.io/apache/hadoop:3.5.0
    hostname: namenode
    command: ["hdfs","namenode"]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.name.dir: "file:///data/name"
    ports:
      - "127.0.0.1:9870:9870"
      - "127.0.0.1:8020:8020"
    volumes:
      - namenode-data:/data

  datanode:
    image: ghcr.io/apache/hadoop:3.5.0
    command: ["hdfs","datanode"]
    depends_on:
      - namenode
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.datanode.data.dir: "file:///data/blocks"
      HDFS-SITE.XML_dfs.datanode.hostname: "127.0.0.1"
      WAITFOR: "namenode:8020"
    ports:
      - "127.0.0.1:9866:9866"
    volumes:
      - datanode-data:/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  namenode-data:
  datanode-data:
  elasticsearch-data:
